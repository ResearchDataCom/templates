---
name: Continuous Integration

# Trigger this workflow manually, by pushing commits to any branch, or
# by filing a pull request.
on:
  workflow_dispatch:
  push:
  pull_request:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/actions/pre-commit@aadcc6fce459afd822ace8e5b14383032dc523ea # v2.2.0
        with:
          access-app-id: ${{ vars.PRIVATE_REPOSITORY_ACCESS_APP_ID }}
          access-key: ${{ secrets.PRIVATE_REPOSITORY_ACCESS_KEY }}

  release:
    # Prevent race conditions of more than one release job in case of
    # multiple pushes to the main branch in a short period of time.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    needs:
      - lint
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: ResearchDataCom/actions/cz-bump@aadcc6fce459afd822ace8e5b14383032dc523ea # v2.2.0
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

  github:
    needs:
      - release
    if: needs.release.outputs.released
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/actions/publish-github@aadcc6fce459afd822ace8e5b14383032dc523ea # v2.2.0
        with:
          artifact-paths: ""
          tag: ${{ needs.release.outputs.tag }}

  docs:
    needs:
      - release
    if: needs.release.outputs.released
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/actions/sphinx-build@aadcc6fce459afd822ace8e5b14383032dc523ea # v2.2.0

  ghpages:
    needs:
      - release
      - docs
    if: needs.release.outputs.released
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/actions/publish-ghpages@aadcc6fce459afd822ace8e5b14383032dc523ea # v2.2.0
